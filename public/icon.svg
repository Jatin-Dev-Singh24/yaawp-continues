<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="yaawp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="yaawp-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#yaawp-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Stylized YAAWP Iconic 'Y' Monogram -->
  <g transform="translate(106, 96)">
    <!-- Main Y stems -->
    <path d="M 20 40 L 150 200 L 280 40" fill="none" stroke="url(#yaawp-stroke)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 150 200 L 150 300" fill="none" stroke="url(#yaawp-stroke)" stroke-width="32" stroke-linecap="round" />
    <!-- Dynamic accent dots / wave nodes -->
    <circle cx="150" cy="200" r="14" fill="#6366f1" />
    <circle cx="20" cy="40" r="10" fill="#a855f7" />
    <circle cx="280" cy="40" r="10" fill="#ec4899" />
    <circle cx="150" cy="300" r="12" fill="#3b82f6" />
  </g>
</svg>
